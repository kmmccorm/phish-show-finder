# .github/workflows/keep-alive.yml
name: keep-supabase-alive
on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mon + Thu
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          PHISH_DATABASE_URL: ${{ secrets.PHISH_DATABASE_URL }}
        run: psql "$PHISH_DATABASE_URL" -c "select count(*) from phish_shows;"
